name: Geometry and route tests
on:
  push:
    branches: [main, fix/perforator-y-local-boundary]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install flask numpy scipy matplotlib
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
